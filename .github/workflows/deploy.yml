name: Deploy ke Hostinger via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v3

      - name: Buat config.local.php
        env:
          DB_HOST:                 ${{ secrets.DB_HOST }}
          DB_NAME:                 ${{ secrets.DB_NAME }}
          DB_USER:                 ${{ secrets.DB_USER }}
          DB_PASS:                 ${{ secrets.DB_PASS }}
          SSO_CLIENT_ID:           ${{ secrets.SSO_CLIENT_ID }}
          SSO_CLIENT_SECRET:       ${{ secrets.SSO_CLIENT_SECRET }}
          SSO_CLIENT_SECRET_PLAIN: ${{ secrets.SSO_CLIENT_SECRET_PLAIN }}
          SSO_PUBLIC_KEY_B64:      ${{ secrets.SSO_PUBLIC_KEY }}
          SSO_URL:                 ${{ secrets.SSO_URL }}
          SSO_VERIFY_URL:          ${{ secrets.SSO_VERIFY_URL }}
          SSO_CALLBACK_URL:        ${{ secrets.SSO_CALLBACK_URL }}
          APP_NAME:                ${{ secrets.APP_NAME }}
          APP_SUBTITLE:            ${{ secrets.APP_SUBTITLE }}
          APP_BASE_URL:            ${{ secrets.APP_BASE_URL }}
        run: |
          SSO_PUBLIC_KEY=$(echo "$SSO_PUBLIC_KEY_B64" | base64 -d)

          cat > config.local.php << PHPEOF
          <?php
          define('DB_HOST',                 '$DB_HOST');
          define('DB_NAME',                 '$DB_NAME');
          define('DB_USER',                 '$DB_USER');
          define('DB_PASS',                 '$DB_PASS');
          define('DB_CHARSET',              'utf8mb4');
          define('SSO_CLIENT_ID',           '$SSO_CLIENT_ID');
          define('SSO_CLIENT_SECRET',       '$SSO_CLIENT_SECRET');
          define('SSO_CLIENT_SECRET_PLAIN', '$SSO_CLIENT_SECRET_PLAIN');
          define('SSO_URL',                 '$SSO_URL');
          define('SSO_VERIFY_URL',          '$SSO_VERIFY_URL');
          define('SSO_CALLBACK_URL',        '$SSO_CALLBACK_URL');
          define('APP_NAME',                '$APP_NAME');
          define('APP_SUBTITLE',            '$APP_SUBTITLE');
          define('APP_BASE_URL',            '$APP_BASE_URL');
          define('PER_PAGE',                25);
          define('SSO_PUBLIC_KEY',          <<<'PEM'
          $SSO_PUBLIC_KEY
          PEM);
          PHPEOF

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          # Prioritas: secret (FTP_HOST/FTP_USER) jika diset, fallback ke hardcode
          server: ${{ secrets.FTP_HOST || '153.92.10.189' }}
          username: ${{ secrets.FTP_USER || 'u781960094.pasar.balmonjogja.info' }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          local-dir: ./
          server-dir: /public_html/
          state-name: ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/schema.sql
            **/import.php
            **/data/**
            **/.gitignore
